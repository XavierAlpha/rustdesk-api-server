<!DOCTYPE html>
<html>
  <head>
    <base href="/">
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Camellia Web Client">
    <meta name="theme-color" content="#247BFF">
    <meta name="color-scheme" content="light dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Camellia">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <title>Camellia Web Client</title>
    <style>
      :root {
        --camellia-primary: #247bff;
        --camellia-page: #f7f9fc;
        --camellia-surface: #ffffff;
        --camellia-ink: #172033;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--camellia-page);
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: var(--camellia-ink);
      }
      #loading .mark {
        width: 56px;
        height: 56px;
        border-radius: 8px;
        background: var(--camellia-primary);
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 700;
        font-size: 24px;
      }
      #loading .pulse {
        width: 90px;
        height: 4px;
        border-radius: 2px;
        overflow: hidden;
        background: color-mix(in srgb, var(--camellia-primary) 16%, transparent);
        position: relative;
      }
      #loading .pulse::after {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-70%);
        background: var(--camellia-primary);
        animation: slide 1.5s infinite;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --camellia-page: #171a20;
          --camellia-surface: #20252d;
          --camellia-ink: #eef3fb;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading .pulse::after {
          animation: none;
          transform: translateX(0);
        }
      }
      @keyframes slide {
        0% {
          transform: translateX(-70%);
        }
        100% {
          transform: translateX(70%);
        }
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="mark">C</div>
      <div>Preparing Camellia Web Client...</div>
      <div class="pulse" aria-hidden="true"></div>
    </div>
    <noscript>Camellia Web Client requires JavaScript to run.</noscript>
    <script>
      window.__CAMELLIA_WEB__ = window.__CAMELLIA_WEB__ || {
        appName: "Camellia",
        version: "",
        buildDate: "",
        apiServer: "",
        isPublicServer: true
      };
      function removeLoading() {
        var loader = document.getElementById("loading");
        if (loader) {
          loader.remove();
        }
      }
      window.addEventListener("flutter-first-frame", removeLoading);
      window.addEventListener("load", function () {
        window.setTimeout(removeLoading, 8000);
      });
    </script>
    <script type="module" src="js/dist/web_bridge.js"></script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
