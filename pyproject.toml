[project]
name = "camellia-api-server"
version = "3.3.16"
description = "Camellia API server: accounts, address books, device management and web console for the Camellia remote desktop suite"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "django>=6.1,<7.0",
  "openpyxl>=3.1,<4",
  "gunicorn>=26,<27",
  "whitenoise>=6.12,<7",
  "authlib>=1.7,<2",
  "requests>=2.32,<3",
  "pynacl>=1.6,<2",
]

[project.optional-dependencies]
mysql = ["mysqlclient>=2.2,<3"]

[dependency-groups]
dev = [
  "ruff>=0.16.1,<0.17",
  "pytest>=9,<10",
  "pytest-django>=4.13.0,<5",
  "coverage>=7.15.4,<8",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [
  "static",
  "static_root",
  "static/web_client",
]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "F403", "F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "rustdesk_server_api.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--strict-markers --reuse-db"

[tool.coverage.run]
source = ["api", "webui2", "rustdesk_server_api"]
omit = ["*/migrations/*", "*/tests.py"]

[tool.coverage.report]
skip_covered = true
show_missing = true
