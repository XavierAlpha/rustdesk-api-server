name: API Server CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run Django checks and tests
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  quality:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEBUG: "true"
      SECRET_KEY: ci-only-secret-key
      ALLOWED_HOSTS: "127.0.0.1,localhost"
      CSRF_TRUSTED_ORIGINS: "http://127.0.0.1:21114"
      SQLITE_DB_PATH: /tmp/camellia-api.sqlite3
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Static analysis
        run: |
          uv run python -m compileall api webui2 rustdesk_server_api
          uv run ruff check api webui2 rustdesk_server_api

      - name: Django checks
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run

      - name: Production settings check
        env:
          DEBUG: "false"
          SECRET_KEY: ci-only-production-secret-key-with-sufficient-length-000
          SECURE_TLS: "true"
        run: uv run python manage.py check --deploy

      - name: Tests
        run: uv run python -m pytest
