name: API Server Docker

on:
  workflow_dispatch:
    inputs:
      build_image:
        description: Build Docker image
        required: true
        type: boolean
        default: true
      publish_ghcr:
        description: Publish image to GHCR
        required: true
        type: boolean
        default: false
      publish_dockerhub:
        description: Publish image to Docker Hub
        required: true
        type: boolean
        default: false
      install_mysql:
        description: Include mysqlclient and MySQL system libraries
        required: true
        type: boolean
        default: false
      platforms:
        description: Target platforms
        required: true
        type: string
        default: linux/amd64,linux/arm64
      dockerhub_image:
        description: Docker Hub image, for example namespace/camellia-api-server
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: api-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.build_image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            INSTALL_MYSQL=${{ inputs.install_mysql }}
          platforms: ${{ inputs.platforms }}
          push: false
          tags: camellia-api-server:ci
          cache-from: type=gha,scope=api-image-${{ inputs.install_mysql }}
          cache-to: type=gha,scope=api-image-${{ inputs.install_mysql }},mode=max

  publish-ghcr:
    if: ${{ inputs.publish_ghcr }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish GHCR image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            INSTALL_MYSQL=${{ inputs.install_mysql }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api-image-${{ inputs.install_mysql }}
          cache-to: type=gha,scope=api-image-${{ inputs.install_mysql }},mode=max
          provenance: mode=max
          sbom: true

  publish-dockerhub:
    if: ${{ inputs.publish_dockerhub }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Docker Hub image
        env:
          DOCKERHUB_IMAGE: ${{ inputs.dockerhub_image }}
        run: |
          if [ -z "$DOCKERHUB_IMAGE" ]; then
            echo "dockerhub_image is required when Docker Hub publishing is enabled" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.dockerhub_image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish Docker Hub image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            INSTALL_MYSQL=${{ inputs.install_mysql }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api-image-${{ inputs.install_mysql }}
          cache-to: type=gha,scope=api-image-${{ inputs.install_mysql }},mode=max
          provenance: mode=max
          sbom: true
